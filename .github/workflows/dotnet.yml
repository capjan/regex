name: .NET

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build -c Release --no-restore
    - name: Test
      run: dotnet test -c Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage
    - name: Coverage summary and badge
      if: matrix.os == 'ubuntu-latest'
      run: |
        python3 .github/scripts/coverage-badge.py "$(ls coverage/*/coverage.cobertura.xml | head -n1)" coverage/coverage.svg "$GITHUB_STEP_SUMMARY"
    - name: Publish coverage badge
      if: matrix.os == 'ubuntu-latest' && github.event_name == 'push'
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        cd coverage
        git init -q -b badges
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add coverage.svg
        git commit -q -m "Update coverage badge"
        git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" badges
